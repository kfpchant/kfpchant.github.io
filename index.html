function show(id) {
  ["home", "list", "read"].forEach(function (name) {
    document.getElementById(name).classList.toggle("hide", name !== id);
  });
}
albums.forEach(function (album, i) {
  var b = document.createElement("button");
  b.innerHTML = album[0] + "<small>" + album[1] + "</small>";
  b.onclick = function () { openAlbum(i); };
  document.getElementById("albums").appendChild(b);
});
function openAlbum(i) {
  document.getElementById("listTitle").textContent = albums[i][0];
  var songs = document.getElementById("songs");
  songs.innerHTML = "";
  albums[i][2].forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name;
    b.style.fontSize = "16px";
    b.onclick = function () { openSong(name); };
    songs.appendChild(b);
  });
  show("list");
}
function openSong(name) {
  document.getElementById("songTitle").textContent = name;
  var lines = document.getElementById("lines");
  var chant = chants[name];
  if (!chant) {
    lines.innerHTML = "<p class='line'>이 곡은 다음에 넣습니다.</p>";
  } else {
    lines.innerHTML = chant.map(function (text) {
      return "<p class='line'>" + text + "</p>";
    }).join("");
  }
  show("read");
}
